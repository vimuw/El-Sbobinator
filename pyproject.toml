[project]
name = "el-sbobinator"
version = "0.0.0"
requires-python = ">=3.11.5,<3.12"
dependencies = [
  "beautifulsoup4==4.15.0",
  "certifi==2026.10.23",
  "google-genai==2.33.0",
  "imageio-ffmpeg==0.6.0",
  "markdown==3.11.2",
  "keyring==25.7.0",
  "packaging==26.3",
  "pywebview==6.2.1",
  "plyer==2.1.0",
  "nh3==0.3.7",
  "tzdata==2026.5; sys_platform == 'win32'",
]

[dependency-groups]
build = ["pyinstaller==6.22.3", "setuptools==84.2.1"]
dev = [
  "ruff==0.17.2",
  "pre-commit==4.7.0",
  "pyright==1.1.414",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-xdist==3.8.0",
  "pip-audit==2.10.1",
  "pip==26.2.2",
  "fastapi>=0.161.1",
  "uvicorn[standard]>=0.54.0",
  "python-multipart>=0.0.32",
  "httpx>=0.28.1",
  "pydantic>=2.14.1",
  "Pillow>=12.0.0",
]

[tool.uv]
package = false
default-groups = ["build", "dev"]

[tool.ruff]
target-version = "py311"
extend-exclude = [
  ".venv",
  "build",
  "dist",
  "test_dist",
  "webui/dist",
  "webui/node_modules",
]

[tool.ruff.lint]
select = [
    "E9",   # syntax errors
    "F63",  # invalid literals / assert
    "F7",   # statement errors (return outside function, etc.)
    "F82",  # undefined names
    "E711", # comparison to None via == / !=
    "E712", # comparison to True/False via == / !=
    "E721", # type comparison — prefer isinstance()
    "E722", # bare except:
    "F841", # local variable assigned but never used
    "C90",  # McCabe cyclomatic complexity
    "I",    # isort — import ordering
    "B",    # flake8-bugbear — mutable defaults, assert-tuple, etc.
    "UP",   # pyupgrade — modernise to py311 idioms
    "RUF",  # ruff-specific — unused noqa, ambiguous unicode, etc.
]
ignore = [
    "B904", # raise-from-err inside except — opinionated, many existing sites
]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "All"
typeCheckingMode = "basic"
include = ["el_sbobinator", "scripts", "tests"]
exclude = [".venv", "build", "dist", "test_dist", "webui/dist", "webui/node_modules"]
reportMissingModuleSource = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["el_sbobinator"]
parallel = true
omit = [
    "*/__init__.py",
    "el_sbobinator/app.py",
    "el_sbobinator/webview_entry.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
