repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json

  # ESLint from webui's locked node_modules: the same check as npm run lint and CI.
  - repo: local
    hooks:
      - id: eslint
        name: ESLint (webui)
        entry: npm --prefix webui run lint
        language: system
        files: ^webui/.*\.(ts|tsx|js|mjs)$
        pass_filenames: false
