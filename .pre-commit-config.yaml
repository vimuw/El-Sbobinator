repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json

  # Ruff comes from the same uv.lock as CI, avoiding a second independent pin.
  - repo: local
    hooks:
      - id: ruff-check
        name: Locked Ruff check and format
        entry: python scripts/build_release.py lint --fix
        language: system
        types_or: [python, pyi]
