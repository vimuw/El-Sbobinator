version: 2
# The web site (webui) gets a weekly batch of grouped updates; tooling is checked monthly.
# Security updates follow no schedule and have their own limit, so they still open as soon
# as an advisory appears.
updates:
  - package-ecosystem: npm
    directory: /webui
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [dependencies]
    groups:
      tiptap:
        patterns: ['@tiptap/*']
      vitest:
        patterns: ['vitest', '@vitest/*']
      frontend:
        patterns: ['*']
        update-types: [minor, patch]
    # Runtime is Node 24; types for a newer runtime describe unavailable APIs.
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    groups:
      actions:
        patterns: ['*']
