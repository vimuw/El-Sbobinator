version: 2
# Weekly: one batch of grouped updates to review instead of a daily stream. Security
# updates do not follow this schedule and still open as soon as an advisory appears.
updates:
  - package-ecosystem: uv
    directory: /
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [dependencies]
    groups:
      python:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      bootstrap:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /webui
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [dependencies]
    groups:
      tiptap:
        patterns: ['@tiptap/*']
      vitest:
        patterns: ['vitest', '@vitest/*']
      frontend:
        patterns: ['*']
        update-types: [minor, patch]
    # Runtime is Node 24; types for a newer runtime describe unavailable APIs.
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      actions:
        patterns: ['*']
