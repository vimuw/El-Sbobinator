name: Publish El Sbobinator Web

# Production of the static web site (webui/src/web) on Cloudflare Pages, project
# elsbobinator (https://elsbobinator.pages.dev/). Only a web-v* tag on a commit of
# main publishes; the desktop release workflow (build.yml) listens to v* tags and
# never sees these. It deploys to Cloudflare only: no GitHub Release and no uploaded
# artifacts, so nothing about the web site appears on the repository's Releases page
# or for the desktop updater.
# Google Drive sync is optional: the build includes it only when the repository variable
# EL_SBOBINATOR_GOOGLE_CLIENT_ID holds the site's OAuth client ID (public, not a secret).
on:
  push:
    tags:
      - 'web-v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    name: Test, build and deploy the web site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the tagged revision with main's history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require the tag to point at a commit of main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main: merge the work into main first."; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Install the locked frontend dependencies
        working-directory: webui
        run: npm ci

      - name: Type check
        working-directory: webui
        run: npm run typecheck

      - name: Run the frontend unit and DOM tests
        working-directory: webui
        run: npm test

      - name: Install Chromium for the web browser tests
        working-directory: webui
        run: npx playwright install chromium

      - name: Run the web browser tests (fake Gemini, Chromium)
        working-directory: webui
        run: npm run test:e2e:web

      - name: Build the static site with the tag's version
        working-directory: webui
        env:
          EL_SBOBINATOR_WEB_VERSION: ${{ github.ref_name }}
          EL_SBOBINATOR_GOOGLE_CLIENT_ID: ${{ vars.EL_SBOBINATOR_GOOGLE_CLIENT_ID }}
        run: |
          npm run build:web
          node -e "const v = require('./dist-web/version.json'); if (v.preview) throw new Error('version.json says preview'); console.log('Version', v.version);"

      - name: Check the Google Drive sync of the build
        working-directory: webui
        env:
          EL_SBOBINATOR_GOOGLE_CLIENT_ID: ${{ vars.EL_SBOBINATOR_GOOGLE_CLIENT_ID }}
        run: |
          if [ -n "$EL_SBOBINATOR_GOOGLE_CLIENT_ID" ]; then
            test -f dist-web/drive-auth.html               || { echo "::error::The client ID is set but dist-web/drive-auth.html is missing."; exit 1; }
            grep -q 'https://www.googleapis.com' dist-web/_headers               || { echo "::error::The client ID is set but _headers does not reach the Drive API."; exit 1; }
            echo "Google Drive sync: on"
          else
            # Not an error: the site goes out as before, without Drive.
            echo "::warning::EL_SBOBINATOR_GOOGLE_CLIENT_ID is not set: the site is published without Google Drive sync."
          fi

      - name: Deploy to Cloudflare Pages (production branch)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.149.0'
          command: pages deploy webui/dist-web --project-name=elsbobinator --branch=main --commit-hash=${{ github.sha }}
