name: Publish El Sbobinator Web

# Production of the static web site (webui/src/web) on Cloudflare Pages, project
# elsbobinator (https://elsbobinator.pages.dev/). Only a web-v* tag on a commit of
# main publishes. It deploys to Cloudflare only: no GitHub Release and no uploaded
# artifacts, so nothing about the web site appears on the repository's Releases page,
# which the installed desktop app (2.7.3) checks for updates.
# Google Drive sync is optional: the build includes it only when the repository variable
# EL_SBOBINATOR_GOOGLE_CLIENT_ID holds the site's OAuth client ID (public, not a secret).
on:
  push:
    tags:
      - 'web-v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    name: Test, build and deploy the web site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the tagged revision with main's history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require the tag to point at a commit of main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main: merge the work into main first."; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Install the locked frontend dependencies
        working-directory: webui
        run: npm ci

      - name: Type check
        working-directory: webui
        run: npm run typecheck

      - name: Run the frontend unit and DOM tests
        working-directory: webui
        run: npm test

      - name: Install Chromium for the web browser tests
        working-directory: webui
        run: npx playwright install chromium

      - name: Run the web browser tests (fake Gemini, Chromium)
        working-directory: webui
        run: npm run test:e2e:web

      - name: Build the static site with the tag's version
        working-directory: webui
        env:
          EL_SBOBINATOR_WEB_VERSION: ${{ github.ref_name }}
          EL_SBOBINATOR_GOOGLE_CLIENT_ID: ${{ vars.EL_SBOBINATOR_GOOGLE_CLIENT_ID }}
          EL_SBOBINATOR_SENTRY_DSN: ${{ vars.EL_SBOBINATOR_SENTRY_DSN }}
        run: |
          npm run build:web
          node -e "const v = require('./dist-web/version.json'); if (v.preview) throw new Error('version.json says preview'); console.log('Version', v.version);"

      - name: Check the Google Drive sync of the build
        working-directory: webui
        env:
          EL_SBOBINATOR_GOOGLE_CLIENT_ID: ${{ vars.EL_SBOBINATOR_GOOGLE_CLIENT_ID }}
        run: |
          if [ -n "$EL_SBOBINATOR_GOOGLE_CLIENT_ID" ]; then
            test -f dist-web/drive-auth.html               || { echo "::error::The client ID is set but dist-web/drive-auth.html is missing."; exit 1; }
            grep -q 'https://www.googleapis.com' dist-web/_headers               || { echo "::error::The client ID is set but _headers does not reach the Drive API."; exit 1; }
            test -f '../functions/api/drive/[action].ts'                       || { echo "::error::The client ID is set but the Drive login server (functions/api/drive) is missing."; exit 1; }
            echo "Google Drive sync: on"
          else
            # Not an error: the site goes out as before, without Drive.
            echo "::warning::EL_SBOBINATOR_GOOGLE_CLIENT_ID is not set: the site is published without Google Drive sync."
          fi

      - name: Check the feedback and error reports of the build
        working-directory: webui
        env:
          EL_SBOBINATOR_SENTRY_DSN: ${{ vars.EL_SBOBINATOR_SENTRY_DSN }}
        run: |
          if [ -n "$EL_SBOBINATOR_SENTRY_DSN" ]; then
            test -f ../functions/api/report.ts                                 || { echo "::error::The DSN is set but the reports' tunnel (functions/api/report.ts) is missing."; exit 1; }
            grep -rqsF "$EL_SBOBINATOR_SENTRY_DSN" dist-web/assets                || { echo "::error::The DSN is set but the build does not carry it."; exit 1; }
            ! grep -qi 'sentry' dist-web/_headers                                 || { echo "::error::The policy reaches Sentry directly: reports must go through /api/report."; exit 1; }
            echo "Feedback and error reports: on"
          else
            # Not an error: the site goes out with reports by email (supporto@), as the desktop app does.
            echo "::warning::EL_SBOBINATOR_SENTRY_DSN is not set: the site is published with reports by email."
          fi

      # Run from the repo root: wrangler also bundles functions/ (the Drive login server, /api/drive,
      # and the reports' tunnel, /api/report), which read the project's Production variables
      # GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, DRIVE_COOKIE_KEY, SENTRY_DSN, REPORT_ALLOWED_ORIGIN.
      - name: Deploy to Cloudflare Pages (production branch)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Dependabot cannot update this pin: change it in web-release.yml and web-staging.yml together.
          wranglerVersion: '4.149.0'
          command: pages deploy webui/dist-web --project-name=elsbobinator --branch=main --commit-hash=${{ github.sha }}

      # The deploy step succeeding is not the site serving it: wait until the official
      # address answers with this build's version (version.json is never cached).
      - name: Check that elsbobinator.com serves the new version
        working-directory: webui
        run: |
          expected=$(node -p "require('./dist-web/version.json').version")
          for attempt in $(seq 1 12); do
            served=$(curl -fsS --max-time 10 "https://elsbobinator.com/version.json?check=${GITHUB_SHA}-${attempt}" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).version)}catch{console.log('')}})" || true)
            if [ "$served" = "$expected" ]; then
              echo "elsbobinator.com serves version $served"
              exit 0
            fi
            echo "Attempt $attempt: elsbobinator.com serves '${served}', expected '${expected}'"
            sleep 10
          done
          echo "::error::elsbobinator.com does not serve version $expected after 12 attempts (two to four minutes) since the deploy."
          exit 1
