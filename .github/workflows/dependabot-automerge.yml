name: Enable Dependabot auto-merge

# Metadata only: never check out or execute the pull request in this privileged job.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  # Auto-merges performed with GITHUB_TOKEN do not emit another push workflow.
  workflow_run:
    workflows: [Build and Release El Sbobinator]
    types: [completed]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Wait for required dependency gate before merging this revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$HEAD_SHA"

  refresh:
    needs: [enable]
    if: always() && needs.enable.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: dependabot-refresh-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Ask Dependabot to refresh one stale auto-merging PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Let Dependabot create the new revision: updating it with GITHUB_TOKEN
        # would leave the resulting pull_request checks awaiting human approval.
        # Recreate also covers grouped PRs whose recorded base is already current
        # even though their actual commit ancestry is stale (a rebase can be a no-op).
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          repo = os.environ['GH_REPO']
          root = f'repos/{repo}'

          def api(path, *, pages=False, body=None):
              command = ['gh', 'api', f'{root}/{path}']
              if pages:
                  command.extend(['--paginate', '--slurp'])
              if body is not None:
                  command.extend(['--method', 'POST', '--input', '-'])
              result = subprocess.run(
                  command, input=json.dumps(body) if body is not None else None,
                  capture_output=True, text=True, encoding='utf-8', check=True,
              )
              data = json.loads(result.stdout)
              return [item for page in data for item in page] if pages else data

          def eligible(pr):
              return (
                  pr['state'] == 'open' and not pr['draft']
                  and pr['user']['login'] == 'dependabot[bot]'
                  and pr['base']['ref'] == 'main'
                  and pr['head']['repo'] is not None
                  and pr['head']['repo']['full_name'] == repo
                  and pr['head']['ref'].startswith('dependabot/')
                  and pr.get('auto_merge') is not None
              )

          def refresh():
              base = api('git/ref/heads/main')['object']['sha']
              pulls = api(
                  'pulls?state=open&base=main&sort=created&direction=asc&per_page=100',
                  pages=True,
              )
              for listed in pulls:
                  if not eligible(listed):
                      continue
                  number = listed['number']
                  pr = api(f'pulls/{number}')
                  if not eligible(pr):
                      continue
                  head = pr['head']['sha']
                  comparison = api(f'compare/{base}...{head}')
                  if comparison['behind_by'] == 0:
                      continue

                  # Recreate overwrites edits, so only touch an unmodified,
                  # single-commit PR generated and signed by Dependabot.
                  commits = api(f'pulls/{number}/commits?per_page=100', pages=True)
                  if (
                      len(commits) != 1 or commits[0]['sha'] != head
                      or (commits[0].get('author') or {}).get('login') != 'dependabot[bot]'
                      or (commits[0].get('committer') or {}).get('login') not in {
                          'dependabot[bot]', 'web-flow',
                      }
                      or not commits[0]['commit']['verification']['verified']
                  ):
                      print(f'::warning::PR #{number} has manual or unverified commits; leaving it unchanged.')
                      continue

                  marker = f'<!-- dependabot-refresh:{base}:{head} -->'
                  comments = api(f'issues/{number}/comments?per_page=100', pages=True)
                  if any(
                      comment['user']['login'] == 'github-actions[bot]'
                      and marker in comment['body'] for comment in comments
                  ):
                      print(f'PR #{number}: refresh already requested for this revision.')
                      continue

                  # Re-read before posting so a closed, edited or opted-out PR
                  # does not receive a command from a stale workflow event.
                  current = api(f'pulls/{number}')
                  if not eligible(current) or current['head']['sha'] != head:
                      continue
                  if api('git/ref/heads/main')['object']['sha'] != base:
                      print('main advanced during the scan; retrying on the next run.')
                      return
                  if os.environ.get('REFRESH_DRY_RUN') == 'true':
                      print(f'Would request Dependabot to refresh PR #{number}.')
                      return
                  api(f'issues/{number}/comments', body={
                      'body': f'@dependabot recreate\n\n{marker}\n'
                              'Refresh against main so the required checks run again.',
                  })
                  print(f'Requested Dependabot to refresh PR #{number}.')
                  return
              print('No new Dependabot refresh request needed.')

          refresh()
          PY
