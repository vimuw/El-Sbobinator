name: CI

# Checks every pull request and push for the web site. The site is deployed by
# web-release.yml on web-v* tags. The desktop app (2.7.3) is no longer built here: its
# source stays on the desktop-2.7 branch and its installers on the v2.7.3 release.

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Daily: the audit and every check against the current lock and advisories.
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  change-scope:
    name: Detect documentation-only changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Checkout history for the complete change range
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Schedule and manual runs have no change range: the classifier needs only its
      # own script and then runs every check.
      - name: Checkout the classifier
        if: ${{ !(github.event_name == 'pull_request' || github.event_name == 'push') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Classify the complete change range
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          CURRENT_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci_change_scope.mjs

  checks:
    name: Lint and Test
    needs: [change-scope]
    if: needs.change-scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Install the locked frontend dependencies
        working-directory: webui
        run: npm ci --no-audit --no-fund

      - name: Check dependencies, lint, types and unit tests with coverage
        working-directory: webui
        run: npm run check

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: webui/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  web-checks:
    name: Web site build and browser tests (${{ matrix.shard }}/4)
    needs: [change-scope]
    if: needs.change-scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The browser suite takes about 20 minutes of test time; the runner's 4 vCPUs give Playwright
    # 2 workers, so one job took 11 minutes. Four runners split the web and Drive projects in
    # contiguous blocks of tests; shard 4 then runs the two frame-timing tests on their own.
    # The timing project depends on the other two, and Playwright pulls a dependent test's
    # dependencies into its shard, so sharding the whole suite gave shards 1-2 everything and 3-4 nothing.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Install the locked frontend dependencies
        working-directory: webui
        run: npm ci

      # The same build and browser tests as web-release.yml, so a dependency update that
      # breaks the web site fails here instead of at the web-v* tag.
      - name: Build the static web site
        working-directory: webui
        run: npm run build:web

      - name: Install Chromium for the web browser tests
        working-directory: webui
        # The runner image already ships Chromium's libraries; --with-deps only added
        # CJK/Thai fonts through an apt mirror that sometimes took 10 minutes.
        run: npx playwright install chromium

      - name: Run the web browser tests (fake Gemini, Chromium)
        id: browser-tests
        working-directory: webui
        run: npm run test:e2e:web -- --project=web-chromium --project=web-drive-chromium --shard=${{ matrix.shard }}/4

      # Also after a failed block (not after a failed build), so one run reports both; its own output
      # folder keeps that block's failure evidence, which a second run in the same folder would delete.
      - name: Run the frame-timing browser tests alone
        if: ${{ !cancelled() && matrix.shard == 4 && steps.browser-tests.outcome != 'skipped' }}
        working-directory: webui
        run: npm run test:e2e:web -- --project=web-timing-chromium --no-deps --output=test-results-web-timing

      - name: Upload web browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-browser-failures-${{ matrix.shard }}
          path: webui/test-results-web-*/
          if-no-files-found: ignore
          retention-days: 7

  audit:
    name: Security Audit
    needs: [change-scope]
    if: needs.change-scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Audit the complete npm lock
        run: node scripts/npm_audit.mjs

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: build/dependency-audit/
          if-no-files-found: ignore
          retention-days: 14

  # The check that main's branch protection requires: every job passed, or every one was
  # skipped for a documentation-only change.
  dependency-gate:
    name: Dependency gate
    if: always()
    needs: [change-scope, checks, web-checks, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks or the documentation-only exemption
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module - <<'JS'
          const results = JSON.parse(process.env.RESULTS);
          const scope = results['change-scope'];
          if (scope.result !== 'success') throw new Error('Change detection did not succeed.');
          const docsOnly = scope.outputs.docs_only;
          if (!['true', 'false'].includes(docsOnly)) throw new Error('Change detection did not return a valid scope.');
          const expected = docsOnly === 'true' ? 'skipped' : 'success';
          const unexpected = ['checks', 'web-checks', 'audit'].filter(name => results[name].result !== expected);
          if (unexpected.length) {
            throw new Error(`Expected ${expected} checks; got ${JSON.stringify(Object.fromEntries(unexpected.map(name => [name, results[name].result])))}`);
          }
          console.log(docsOnly === 'true' ? 'Documentation-only exemption verified.' : 'Every required check and audit passed.');
          JS
