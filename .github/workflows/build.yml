name: Build and Release El Sbobinator

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Trigger build only when a new version tag (e.g. v1.0.0) is pushed
  pull_request:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional: tag to publish a Release (e.g. v1.2.3). Leave empty for build-only.'
        required: false
        default: ''
      release_body:
        description: 'Optional: custom description for the release (changelog commits will still be appended).'
        required: false
        default: ''


permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  change-scope:
    name: Detect documentation-only changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Checkout history for the complete change range
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify the complete change range
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          CURRENT_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import PurePosixPath

          event = os.environ['EVENT_NAME']
          revision_range = None
          if event == 'pull_request':
              base = os.environ['PR_BASE_SHA']
              head = os.environ['PR_HEAD_SHA']
              if base and head:
                  revision_range = f'{base}...{head}'
          elif event == 'push' and os.environ['EVENT_REF'].startswith('refs/heads/'):
              before = os.environ['BEFORE_SHA']
              head = os.environ['CURRENT_SHA']
              if before and before != '0' * 40 and head:
                  revision_range = f'{before}..{head}'

          docs_only = False
          if revision_range:
              try:
                  changed = subprocess.check_output(
                      ['git', 'diff', '--no-renames', '--name-only', '-z', revision_range, '--']
                  ).split(b'\0')
                  paths = [PurePosixPath(os.fsdecode(path)) for path in changed if path]
                  # Keep code, dependency files and workflow changes outside the exemption.
                  docs_only = bool(paths) and all(
                      str(path) in {'README.md', 'DISCLAIMER.md'}
                      or (path.parts[0] == 'docs' and path.suffix in {'.md', '.rst', '.txt'})
                      for path in paths
                  )
              except subprocess.CalledProcessError:
                  print('Change range unavailable; running all checks.')

          value = str(docs_only).lower()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'docs_only={value}\n')
          print(f'Documentation-only exemption: {value}')
          PY

  checks:
    name: Lint and Test
    needs: [change-scope]
    if: needs.change-scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            uv.lock
            pyproject.toml
            requirements/bootstrap.txt

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Install Dependencies
        run: |
          python scripts/build_release.py deps --ui webui --dev

      - name: Run Checks
        run: |
          python scripts/build_release.py check --with-coverage --skip-npm-install
          python scripts/build_release.py validate

      - name: Build frontend
        working-directory: webui
        run: npm run build

      - name: Install Chromium for browser smoke tests
        working-directory: webui
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        working-directory: webui
        run: npm run test:e2e:smoke

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-smoke-failures
          path: webui/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-python.xml,webui/coverage/lcov.info
          flags: python,frontend
          fail_ci_if_error: false

  checks-windows:
    name: Lint and Test (Windows)
    needs: [change-scope]
    if: needs.change-scope.outputs.docs_only != 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            uv.lock
            pyproject.toml
            requirements/bootstrap.txt

      - name: Install Python dependencies
        run: python scripts/build_release.py deps --dev --skip-npm-install

      - name: Run Checks
        run: python scripts/build_release.py check --skip-webui

      - name: Audit Windows dependencies
        run: python scripts/build_release.py audit --skip-webui

      - name: Upload Windows dependency audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-windows
          path: build/dependency-audit/
          if-no-files-found: ignore

  audit:
    name: Security Audit
    needs: [change-scope]
    if: needs.change-scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install the same locked environment as local and packaging
        run: python scripts/build_release.py deps --dev --skip-npm-install

      - name: Audit all installed Python packages and the complete npm lock
        run: python scripts/build_release.py audit

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-linux
          path: build/dependency-audit/
          if-no-files-found: ignore

  checks-macos:
    name: Lint and Test (macOS)
    needs: [change-scope]
    if: needs.change-scope.outputs.docs_only != 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install the same locked environment
        run: python scripts/build_release.py deps --dev --skip-npm-install
      - name: Run Checks
        run: python scripts/build_release.py check --skip-webui
      - name: Audit macOS dependencies
        run: python scripts/build_release.py audit --skip-webui
      - name: Upload macOS dependency audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-macos
          path: build/dependency-audit/
          if-no-files-found: ignore

  dependency-gate:
    name: Dependency gate
    if: always()
    needs: [change-scope, checks, checks-windows, checks-macos, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks or the documentation-only exemption
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          results = json.loads(os.environ['RESULTS'])
          scope = results['change-scope']
          if scope['result'] != 'success':
              raise SystemExit('Change detection did not succeed.')
          docs_only = scope['outputs'].get('docs_only')
          if docs_only not in {'true', 'false'}:
              raise SystemExit('Change detection did not return a valid scope.')

          expected = 'skipped' if docs_only == 'true' else 'success'
          check_jobs = ['checks', 'checks-windows', 'checks-macos', 'audit']
          unexpected = {
              name: results[name]['result']
              for name in check_jobs
              if results[name]['result'] != expected
          }
          if unexpected:
              raise SystemExit(f'Expected {expected} checks; got {unexpected}')
          print('Documentation-only exemption verified.' if docs_only == 'true'
                else 'Every platform and audit passed.')
          PY

  release-context:
    name: Validate build revision and release tag
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.context.outputs.tag }}
      version: ${{ steps.context.outputs.version }}
      commit: ${{ steps.context.outputs.commit }}
      prerelease: ${{ steps.context.outputs.prerelease }}
    steps:
      - name: Checkout the exact workflow revision and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate the selected source and release version
        id: context
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: python scripts/ci_release.py context

  build:
    needs: [dependency-gate, release-context]
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: El-Sbobinator-Windows-Setup
          - os: macos-latest
            asset_name: El-Sbobinator-MacOS-DMG

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-context.outputs.commit }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            uv.lock
            pyproject.toml
            requirements/bootstrap.txt

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Install Dependencies
        run: |
          python scripts/build_release.py deps --ui webui

      - name: Extract version and sync package.json
        shell: bash
        env:
          APP_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('./webui/package.json','utf8'));
            pkg.version = process.env.APP_VERSION;
            fs.writeFileSync('./webui/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Version set to ${APP_VERSION}"

      - name: Verify installed Python versions before packaging
        run: python scripts/build_release.py verify-deps --webui

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y

      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Build Windows Installer
        if: runner.os == 'Windows'
        run: |
          python scripts/build_release.py build --target windows --ui webui --skip-checks --skip-npm-install --version ${{ env.APP_VERSION }}

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: |
          python scripts/build_release.py build --target macos --ui webui --skip-checks --skip-npm-install --version ${{ env.APP_VERSION }}

      - name: Upload Build Artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/El-Sbobinator-Setup-v*.exe
            dist/El-Sbobinator-Setup-v*.exe.sha256
          retention-days: 1
          if-no-files-found: error

      - name: Upload Build Artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/El-Sbobinator-v*.dmg
            dist/El-Sbobinator-v*.dmg.sha256
          retention-days: 1
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build, release-context]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: needs.release-context.outputs.tag != ''
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-context.outputs.commit }}
          fetch-depth: 0

      - name: Verify the release tag still matches the built revision
        env:
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
          BUILT_SHA: ${{ needs.release-context.outputs.commit }}
        run: python scripts/ci_release.py verify-tag --tag "$RELEASE_TAG" --commit "$BUILT_SHA"

      - name: Download all workflow run artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: output_files

      - name: Prepare Release Assets
        env:
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          python scripts/ci_release.py collect-assets --version "$RELEASE_VERSION"

      - name: Generate Changelog
        run: |
          python scripts/generate_changelog.py \
            --tag "$RELEASE_TAG" \
            --output release_changelog.md
        env:
          CUSTOM_RELEASE_BODY: ${{ inputs.release_body }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release-context.outputs.tag }}
          target_commitish: ${{ needs.release-context.outputs.commit }}
          files: release_assets/*
          body_path: release_changelog.md
          prerelease: ${{ needs.release-context.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
