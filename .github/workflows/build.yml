name: Build and Release El Sbobinator

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Trigger build only when a new version tag (e.g. v1.0.0) is pushed
  pull_request:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional: tag to publish a Release (e.g. v1.2.3). Leave empty for build-only.'
        required: false
        default: ''
      release_body:
        description: 'Optional: custom description for the release (changelog commits will still be appended).'
        required: false
        default: ''


permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  checks:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            uv.lock
            pyproject.toml
            requirements/bootstrap.txt

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Install Dependencies
        run: |
          python scripts/build_release.py deps --ui webui --dev

      - name: Run Checks
        run: |
          python scripts/build_release.py check --with-coverage --skip-npm-install
          python scripts/build_release.py validate

      - name: Build frontend
        working-directory: webui
        run: npm run build

      - name: Install Chromium for browser smoke tests
        working-directory: webui
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        working-directory: webui
        run: npm run test:e2e:smoke

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-smoke-failures
          path: webui/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-python.xml,webui/coverage/lcov.info
          flags: python,frontend
          fail_ci_if_error: false

  checks-windows:
    name: Lint and Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            uv.lock
            pyproject.toml
            requirements/bootstrap.txt

      - name: Install Python dependencies
        run: python scripts/build_release.py deps --dev --skip-npm-install

      - name: Run Checks
        run: python scripts/build_release.py check --skip-webui

      - name: Audit Windows dependencies
        run: python scripts/build_release.py audit --skip-webui

      - name: Upload Windows dependency audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-windows
          path: build/dependency-audit/
          if-no-files-found: ignore

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install the same locked environment as local and packaging
        run: python scripts/build_release.py deps --dev --skip-npm-install

      - name: Audit all installed Python packages and the complete npm lock
        run: python scripts/build_release.py audit

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-linux
          path: build/dependency-audit/
          if-no-files-found: ignore

  checks-macos:
    name: Lint and Test (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install the same locked environment
        run: python scripts/build_release.py deps --dev --skip-npm-install
      - name: Run Checks
        run: python scripts/build_release.py check --skip-webui
      - name: Audit macOS dependencies
        run: python scripts/build_release.py audit --skip-webui
      - name: Upload macOS dependency audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-macos
          path: build/dependency-audit/
          if-no-files-found: ignore

  dependency-gate:
    name: Dependency gate
    if: always()
    needs: [checks, checks-windows, checks-macos, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform and audit to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python -c "import json,os; results=json.loads(os.environ['RESULTS']); assert all(job['result']=='success' for job in results.values()), results"

  build:
    needs: [dependency-gate]
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: El-Sbobinator-Windows-Setup
          - os: macos-latest
            asset_name: El-Sbobinator-MacOS-DMG

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            uv.lock
            pyproject.toml
            requirements/bootstrap.txt

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Install Dependencies
        run: |
          python scripts/build_release.py deps --ui webui

      - name: Extract version and sync package.json
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            export APP_VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "$RELEASE_TAG" ]]; then
            export APP_VERSION="$RELEASE_TAG"
            export APP_VERSION="${APP_VERSION#v}"
          else
            export APP_VERSION="0.0.0"
          fi
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('./webui/package.json','utf8'));
            pkg.version = process.env.APP_VERSION;
            fs.writeFileSync('./webui/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Version set to ${APP_VERSION}"
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}

      - name: Verify installed Python versions before packaging
        run: python scripts/build_release.py verify-deps --webui

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y

      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Build Windows Installer
        if: runner.os == 'Windows'
        run: |
          python scripts/build_release.py build --target windows --ui webui --skip-checks --skip-npm-install --version ${{ env.APP_VERSION }}

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: |
          python scripts/build_release.py build --target macos --ui webui --skip-checks --skip-npm-install --version ${{ env.APP_VERSION }}

      - name: Upload Build Artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/El-Sbobinator-Setup-v*.exe
            dist/El-Sbobinator-Setup-v*.exe.sha256
          retention-days: 1

      - name: Upload Build Artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/El-Sbobinator-v*.dmg
            dist/El-Sbobinator-v*.dmg.sha256
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download all workflow run artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: output_files

      - name: Prepare Release Assets
        run: |
          mkdir release_assets
          find output_files -name "El-Sbobinator-Setup-v*.exe" -exec mv {} release_assets/ \; || echo "Win build not found"
          find output_files -name "El-Sbobinator-Setup-v*.exe.sha256" -exec mv {} release_assets/ \; || echo "Win checksum not found"
          find output_files -name "El-Sbobinator-v*.dmg" -exec mv {} release_assets/ \; || echo "Mac build not found"
          find output_files -name "El-Sbobinator-v*.dmg.sha256" -exec mv {} release_assets/ \; || echo "Mac checksum not found"

      - name: Generate Changelog
        run: |
          python scripts/generate_changelog.py \
            --tag "$RELEASE_TAG" \
            --output release_changelog.md
        env:
          CUSTOM_RELEASE_BODY: ${{ inputs.release_body }}
          RELEASE_TAG: ${{ (startsWith(github.ref, 'refs/tags/') && github.ref_name) || inputs.release_tag }}

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ (startsWith(github.ref, 'refs/tags/') && github.ref_name) || inputs.release_tag }}
          files: release_assets/*
          body_path: release_changelog.md
          prerelease: ${{ contains(github.ref_name, '-') || (inputs.release_tag != '' && contains(inputs.release_tag, '-')) }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
