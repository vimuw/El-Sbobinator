<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self';
                   style-src 'self' 'unsafe-inline';
                   img-src 'self' data: blob:;
                   font-src 'self' data:;
                   connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:* http://localhost:* ws://localhost:* https://api.github.com;
                   media-src http://127.0.0.1:*;
                   object-src 'none';
                   base-uri 'self';" />
    <script src="/boot-theme.js"></script>
    <title>El Sbobinator</title>
    <style>
      :root {
        --boot-bg: #f7f6f3;
        --boot-sidebar: #f1f0ec;
        --boot-card-bg: #ffffff;
        --boot-border: rgba(100, 116, 139, 0.16);
        --boot-skeleton: rgba(100, 116, 139, 0.08);
      }

      :root[data-theme="dark"] {
        --boot-bg: #191919;
        --boot-sidebar: #252525;
        --boot-card-bg: #202020;
        --boot-border: rgba(255, 255, 255, 0.08);
        --boot-skeleton: rgba(255, 255, 255, 0.06);
      }

      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: var(--boot-bg);
      }

      body {
        background: var(--boot-bg);
        font-family: "Manrope", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      }

      .boot-shell {
        display: flex;
        height: 100vh;
        width: 100vw;
        box-sizing: border-box;
      }

      .boot-sidebar {
        width: 56px;
        height: 100%;
        flex-shrink: 0;
        background: var(--boot-sidebar);
        border-right: 1px solid var(--boot-border);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 16px 0;
        box-sizing: border-box;
      }

      .boot-sidebar-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .boot-sidebar-icon {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: var(--boot-skeleton);
      }

      .boot-sidebar-icon.logo {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: rgba(61, 107, 58, 0.20);
      }

      .boot-sidebar-icon.small {
        width: 22px;
        height: 22px;
        border-radius: 6px;
      }

      .boot-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 40px min(48px, 4vw);
        gap: 28px;
        overflow-y: auto;
        box-sizing: border-box;
      }

      .boot-header-skeleton {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .boot-title-skeleton {
        width: 210px;
        height: 36px;
        border-radius: 10px;
        background: var(--boot-skeleton);
      }

      .boot-subtitle-skeleton {
        width: 320px;
        height: 16px;
        border-radius: 6px;
        background: var(--boot-skeleton);
      }

      .boot-stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
        width: 100%;
      }

      .boot-stat-card {
        height: 110px;
        border-radius: 16px;
        border: 1px solid var(--boot-border);
        background: var(--boot-card-bg);
      }

      .boot-dropzone-card {
        width: 100%;
        height: 240px;
        border-radius: 16px;
        border: 2px dashed var(--boot-border);
        background: var(--boot-card-bg);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .boot-dropzone-inner {
        width: 120px;
        height: 48px;
        border-radius: 10px;
        background: var(--boot-skeleton);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" aria-hidden="true">
        <!-- Sidebar Skeleton -->
        <aside class="boot-sidebar">
          <div class="boot-sidebar-group">
            <div class="boot-sidebar-icon logo"></div>
            <div class="boot-sidebar-icon"></div>
            <div class="boot-sidebar-icon"></div>
          </div>
          <div class="boot-sidebar-group">
            <div class="boot-sidebar-icon small"></div>
            <div class="boot-sidebar-icon small"></div>
            <div class="boot-sidebar-icon small"></div>
          </div>
        </aside>

        <!-- Main Content Skeleton -->
        <main class="boot-main">
          <div class="boot-header-skeleton">
            <div class="boot-title-skeleton"></div>
            <div class="boot-subtitle-skeleton"></div>
          </div>
          <div class="boot-stats-grid">
            <div class="boot-stat-card"></div>
            <div class="boot-stat-card"></div>
            <div class="boot-stat-card"></div>
          </div>
          <div class="boot-dropzone-card">
            <div class="boot-dropzone-inner"></div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
