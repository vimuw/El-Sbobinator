<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self' 'unsafe-eval' 'unsafe-inline';
                   style-src 'self' 'unsafe-inline';
                   img-src 'self' data: blob:;
                   font-src 'self' data:;
                   frame-src https://www.youtube.com https://www.youtube-nocookie.com;
                   connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:* http://localhost:* ws://localhost:* https://api.github.com;
                   media-src http://127.0.0.1:*;
                   object-src 'none';
                   base-uri 'self';" />
    <script src="./startup-guard.js"></script>
    <script src="./diagnostics-boot.js"></script>
    <script src="./boot-theme.js"></script>
    <title>El Sbobinator</title>
    <link rel="icon" type="image/png" href="./icon.png" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <style>
      /* Until React mounts the page shows only the theme background (theme.css --bg-base):
         a mock layout would differ from the real screen and flash a second page. */
      :root {
        --boot-bg: #f0ede6;
      }

      :root[data-theme="dark"] {
        --boot-bg: #191919;
      }

      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: var(--boot-bg);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
